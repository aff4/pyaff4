version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    ignore:
      # cryptography 49+ publishes no macOS x86_64 wheels, so Intel Macs would build it from source.
      - dependency-name: cryptography
        versions: [">=49"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
